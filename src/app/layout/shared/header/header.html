<nav class="navbar navbar-expand-lg navbar-dark bg-wood shadow-sm sticky-top py-3">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 text-warning d-flex align-items-center gap-2 me-4" routerLink="/">
      <i class="bi bi-tree-fill fs-2 text-warning"></i> <span class="text-white fw-bold">Wood</span><span class="text-warning fw-bold">Craft</span>
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold fs-5 gap-2">
        <li class="nav-item">
          <a class="nav-link text-light px-3" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">الرئيسية</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-3" routerLink="/products" routerLinkActive="active">المنتجات الخشبية</a>
        </li>
        <li class="nav-item" *ngIf="currentUser">
          <a class="nav-link text-light px-3" routerLink="/my-orders" routerLinkActive="active">طلباتي والتتبع</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-3" routerLink="/contact" routerLinkActive="active">تواصل معنا</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <a routerLink="/cart" class="btn btn-outline-warning position-relative px-3 py-2 fw-bold">
          <i class="bi bi-cart3 fs-5 me-1"></i> السلة
          <span *ngIf="cartCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ cartCount }}
          </span>
        </a>

        <ng-container *ngIf="currentUser; else authLinks">
          <div class="dropdown">
            <button class="btn btn-warning dropdown-toggle fw-bold text-dark px-3" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i> {{ currentUser.name }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
              <li *ngIf="currentUser.role === 'admin'">
                <a class="dropdown-item fw-bold text-danger py-2" routerLink="/dashboard">
                  <i class="bi bi-speedometer2 me-2"></i> لوحة التحكم (Admin)
                </a>
              </li>
              <li>
                <a class="dropdown-item py-2" routerLink="/my-orders">
                  <i class="bi bi-bag-check me-2"></i> طلباتي
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-dark py-2" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i> تسجيل الخروج
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-template #authLinks>
          <a routerLink="/login" class="btn btn-outline-warning px-3">دخول</a>
          <a routerLink="/register" class="btn btn-warning text-dark fw-bold px-3">حساب جديد</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
