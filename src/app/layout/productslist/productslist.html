<div class="container my-4">
  <div class="text-center mb-4">
    <h2 class="fw-bold text-wood">معرض المنتجات الخشبية</h2>
    <p class="text-muted">استكشف جميع منتجاتنا المصنوعة من أجود أنواع الخشب الطبيعي</p>
  </div>

  <div class="row g-3 mb-4 align-items-center">
    <div class="col-md-8">
      <div class="d-flex flex-wrap gap-2">
        <button (click)="filterCategory('')" [class.btn-wood]="selectedCategory === ''" [class.btn-outline-wood]="selectedCategory !== ''" class="btn btn-sm">الكل</button>
        <button *ngFor="let cat of categories" (click)="filterCategory(cat)" [class.btn-wood]="selectedCategory === cat" [class.btn-outline-wood]="selectedCategory !== cat" class="btn btn-sm">
          {{ cat }}
        </button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="ابحث عن منتج..." [(ngModel)]="searchQuery" (keyup.enter)="onSearch()">
        <button class="btn btn-wood" (click)="onSearch()"><i class="bi bi-search"></i></button>
      </div>
    </div>
  </div>

  <div class="row g-4" *ngIf="myProducts.length > 0; else noData">
    <div class="col-md-4 col-lg-3" *ngFor="let prod of myProducts">
      <div class="card card-product h-100 shadow-sm border-0">
        <img [src]="fileURL + prod.imgURL" class="card-img-top" [alt]="prod.name" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <span class="badge bg-warning text-dark align-self-start mb-2">{{ prod.category }}</span>
          <h6 class="card-title fw-bold text-dark mb-1">{{ prod.name }}</h6>
          <p class="card-text text-muted small flex-grow-1">{{ prod.desc }}</p>
          
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <span class="fw-bold text-wood fs-5">{{ prod.price }} ج.م</span>
            <button (click)="addToCart(prod)" class="btn btn-sm btn-wood">
              <i class="bi bi-cart-plus"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <div class="text-center py-5 text-muted">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>
      <h5>لا توجد منتجات مطابقة للبحث</h5>
    </div>
  </ng-template>
</div>
